services:
  postgres:
    image: postgres:16-alpine
    container_name: cloud-sim-lab-postgres
    environment:
      POSTGRES_DB: cloudsimlab
      POSTGRES_USER: cloudsimlab
      POSTGRES_PASSWORD: cloudsimlab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudsimlab -d cloudsimlab"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
